services:
  gateway:
    image: nginx:1.27-alpine
    container_name: chats-osint-gateway
    depends_on:
      - frontend
    ports:
      - "443:443"
    volumes:
      - ./public/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
